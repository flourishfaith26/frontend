<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevSup Real-Time Connection Test</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b1120; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 28px; max-width: 580px; width: 100%; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
        h1 { font-size: 1.5rem; color: #38bdf8; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        p.subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 24px; }
        .badge-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding: 12px 16px; background: #0f172a; border-radius: 10px; border: 1px solid #1e293b; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 10px #ef4444; transition: all 0.3s ease; }
        .status-dot.connected { background: #22c55e; box-shadow: 0 0 12px #22c55e; }
        .status-text { font-weight: 600; font-size: 1rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .info-box { background: #0f172a; padding: 12px 16px; border-radius: 10px; border: 1px solid #334155; }
        .info-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 4px; }
        .info-value { font-family: monospace; font-size: 0.9rem; color: #f1f5f9; word-break: break-all; }
        .actions { display: flex; gap: 10px; margin-bottom: 20px; }
        button { background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 0.9rem; }
        button:hover { background: #0369a1; }
        button.secondary { background: #334155; }
        button.secondary:hover { background: #475569; }
        .logs-title { font-size: 0.85rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; font-weight: 600; }
        .log-window { background: #090d16; border: 1px solid #1e293b; border-radius: 10px; padding: 12px; height: 160px; overflow-y: auto; font-family: monospace; font-size: 0.82rem; }
        .log-entry { margin-bottom: 6px; color: #cbd5e1; }
        .log-entry .time { color: #64748b; margin-right: 6px; }
        .log-entry.success { color: #4ade80; }
        .log-entry.info { color: #38bdf8; }
        .log-entry.warn { color: #fbbf24; }
    </style>
</head>

<body>
    <div class="card">
        <h1>⚡ DevSup Real-Time Status</h1>
        <p class="subtitle">Live WebSocket & Socket.IO telemetry with backend</p>

        <div class="badge-row">
            <div id="statusDot" class="status-dot"></div>
            <div id="statusText" class="status-text" style="color: #ef4444;">Connecting to backend...</div>
        </div>

        <div class="grid">
            <div class="info-box">
                <div class="info-label">Socket ID</div>
                <div id="socketId" class="info-value">—</div>
            </div>
            <div class="info-box">
                <div class="info-label">Transport</div>
                <div id="transportType" class="info-value">—</div>
            </div>
            <div class="info-box">
                <div class="info-label">Server URL</div>
                <div class="info-value">http://localhost:5000</div>
            </div>
            <div class="info-box">
                <div class="info-label">Ping Latency</div>
                <div id="pingTime" class="info-value">—</div>
            </div>
        </div>

        <div class="actions">
            <button onclick="pingServer()">Send Ping</button>
            <button class="secondary" onclick="emitUserConnected()">Emit user_connected</button>
        </div>

        <div class="logs-title">Live Event Stream</div>
        <div id="logWindow" class="log-window"></div>
    </div>

    <script>
        const logWindow = document.getElementById('logWindow');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const socketIdEl = document.getElementById('socketId');
        const transportEl = document.getElementById('transportType');
        const pingTimeEl = document.getElementById('pingTime');

        function log(message, type = '') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = 'log-entry ' + type;
            div.innerHTML = `<span class="time">[${time}]</span> ${message}`;
            logWindow.appendChild(div);
            logWindow.scrollTop = logWindow.scrollHeight;
        }

        log('Initializing connection to http://localhost:5000...', 'info');

        const socket = io('http://localhost:5000', {
            transports: ['websocket', 'polling']
        });

        socket.on('connect', () => {
            statusDot.className = 'status-dot connected';
            statusText.textContent = 'Connected (Real-Time Active)';
            statusText.style.color = '#22c55e';
            socketIdEl.textContent = socket.id;
            transportEl.textContent = socket.io.engine.transport.name.toUpperCase();
            
            log(`✅ Connected with Socket ID: ${socket.id}`, 'success');
            log(`⚡ Transport protocol: ${socket.io.engine.transport.name}`, 'info');

            // Listen to transport upgrades
            socket.io.engine.on('upgrade', (transport) => {
                transportEl.textContent = transport.name.toUpperCase();
                log(`⚡ Transport upgraded to: ${transport.name}`, 'info');
            });

            // Automatically emit test user connection
            emitUserConnected();
            pingServer();
        });

        socket.on('connect_error', (err) => {
            statusDot.className = 'status-dot';
            statusText.textContent = 'Connection Error';
            statusText.style.color = '#ef4444';
            log(`❌ Error: ${err.message}`, 'warn');
        });

        socket.on('disconnect', (reason) => {
            statusDot.className = 'status-dot';
            statusText.textContent = 'Disconnected';
            statusText.style.color = '#ef4444';
            socketIdEl.textContent = '—';
            transportEl.textContent = '—';
            log(`⚠️ Disconnected: ${reason}`, 'warn');
        });

        function emitUserConnected() {
            if (!socket.connected) return log('Cannot emit: not connected', 'warn');
            const testId = 'auth0|test_user_123';
            socket.emit('user_connected', testId);
            log(`📤 Emitted 'user_connected' for ${testId}`, 'info');
        }

        function pingServer() {
            if (!socket.connected) return log('Cannot ping: not connected', 'warn');
            const start = Date.now();
            socket.emit('ping_check', null, (response) => {
                const latency = Date.now() - start;
                pingTimeEl.textContent = `${latency} ms`;
                log(`⏱️ Round-trip latency: ${latency} ms (Server response: ${response.status})`, 'info');
            });
        }
    </script>
</body>

</html>
